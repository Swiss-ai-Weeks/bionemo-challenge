name: axel-bionemo

x-nim: &nim
  restart: unless-stopped
  runtime: nvidia
  shm_size: 16gb
  ulimits:
    memlock: {soft: -1, hard: -1}
    stack: 67108864
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  app:
    image: axel-affinity-app:local
    build:
      context: .
      dockerfile: webapp/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      RUN_WORKER: "0"
      APP_DATA_DIR: /workspace-data
      BOLTZ_URL: http://boltz2:8000
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      - app-data:/workspace-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/status', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
  worker:
    image: axel-affinity-app:local
    build:
      context: .
      dockerfile: webapp/Dockerfile
    command: ["python", "-m", "webapp.worker"]
    restart: unless-stopped
    init: true
    environment:
      APP_DATA_DIR: /workspace-data
      BOLTZ_URL: http://boltz2:8000
    volumes:
      - app-data:/workspace-data
  cache-init:
    image: nvidia/cuda:13.0.0-base-ubuntu22.04
    user: "0:0"
    command: ["sh", "-c", "chown 1000:1000 /cache/openfold /cache/boltz /output/boltz"]
    volumes:
      - openfold-cache:/cache/openfold
      - boltz-cache:/cache/boltz
      - boltz-output:/output/boltz
  openfold3:
    <<: *nim
    profiles: [openfold]
    depends_on:
      cache-init:
        condition: service_completed_successfully
    image: nvcr.io/nim/openfold/openfold3:1.5.0
    environment:
      NGC_API_KEY: ${NGC_API_KEY:?Set NGC_API_KEY in .env}
      NVIDIA_VISIBLE_DEVICES: ${OPENFOLD_GPU_ID:-1}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - openfold-cache:/opt/nim/.cache
  boltz2:
    <<: *nim
    depends_on:
      cache-init:
        condition: service_completed_successfully
    image: nvcr.io/nim/mit/boltz2:1.9.0
    environment:
      NGC_API_KEY: ${NGC_API_KEY:?Set NGC_API_KEY in .env}
      NVIDIA_VISIBLE_DEVICES: ${BOLTZ_GPU_ID:-0}
      NIM_OUTPUT_PATH: /opt/nim/output
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - boltz-cache:/opt/nim/.cache
      - boltz-output:/opt/nim/output

volumes:
  openfold-cache:
  boltz-cache:
  boltz-output:
  app-data:
